; Align PHP upload limits with the application's validation contract.
; Image uploads across the app validate at max:10240 (10 MB), so PHP must
; accept at least that much. post_max_size is kept above upload_max_filesize
; to leave room for other multipart fields sent alongside the file.
upload_max_filesize = 12M
post_max_size = 16M
file_uploads = On
max_file_uploads = 20
